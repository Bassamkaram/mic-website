# Netlify configuration for mic-lb.com
# Static site, no build step. Pinning publish here means the deploy
# can never land in the wrong directory.

[build]
  publish = "."
  command = ""

# Clean URLs: /about instead of /about.html
[build.processing]
  skip_processing = false

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# HTML should always revalidate so a deploy is visible immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Static assets can be cached hard since they change by filename
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
