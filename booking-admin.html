<title>Bookings — MIC admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="icon" type="image/png" href="mic-icon-128.png" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="booking.css" />
</head>
<body>
<header class="nav-wrap">
  <nav class="nav" aria-label="Main">
    <a href="index.html" class="nav-brand"><img src="mic-lockup-horizontal.png" alt="Metn Innovation Campus — MIC"/></a>
    <div class="nav-links"><a href="booking.html">Public booking page</a></div>
    <div class="nav-cta">
      <button class="btn btn--ghost" id="admOut" hidden style="padding:8px 16px;font-size:13px;">Sign out</button>
    </div>
  </nav>
</header>

<section class="bk-head">
  <div class="container">
    <span class="eyebrow"><span class="num">&rarr;</span> Staff only</span>
    <h1>Room <em>bookings</em>.</h1>
  </div>
</section>

<section class="container bk-wrap">
  <div id="admMsg"></div>

  <!-- sign in -->
  <div class="bk-panel adm-login" id="admLogin">
    <h3 style="font-family:var(--serif);font-size:22px;color:var(--cedar);margin:0 0 4px;">Sign in</h3>
    <p class="bk-muted" style="margin-bottom:16px;">Use your MIC staff account.</p>
    <form id="admForm">
      <div class="bk-field" style="margin-bottom:12px;">
        <label for="admEmail">Email</label>
        <input id="admEmail" type="email" required autocomplete="username"/>
      </div>
      <div class="bk-field" style="margin-bottom:16px;">
        <label for="admPass">Password</label>
        <input id="admPass" type="password" required autocomplete="current-password"/>
      </div>
      <button class="btn btn--primary btn--block" id="admGo" type="submit">Sign in</button>
    </form>
  </div>

  <!-- console -->
  <div id="admPanel" hidden>
    <div class="adm-tabs" id="admTabs">
      <button class="adm-tab" data-view="calendar"  aria-pressed="true">Calendar</button>
      <button class="adm-tab" data-view="pending"   aria-pressed="false">Pending <span class="c" id="cPending">0</span></button>
      <button class="adm-tab" data-view="waitlist"  aria-pressed="false">Waitlist <span class="c" id="cWait">0</span></button>
      <button class="adm-tab" data-view="confirmed" aria-pressed="false">Confirmed <span class="c" id="cConf">0</span></button>
      <button class="adm-tab" data-view="all"       aria-pressed="false">Everything</button>
      <button class="adm-tab" data-view="add"       aria-pressed="false">+ Add booking</button>
    </div>

    <!-- ============ calendar ============ -->
    <div id="admCal" hidden>
      <div class="adm-calwrap">
        <div class="bk-cal adm-cal">
          <div class="bk-cal-top">
            <strong id="admMonth">&nbsp;</strong>
            <div class="bk-nav">
              <button type="button" id="admPrev" aria-label="Previous month">&#8249;</button>
              <button type="button" id="admToday" style="width:auto;padding:0 12px;font-size:12px;">Today</button>
              <button type="button" id="admNext" aria-label="Next month">&#8250;</button>
            </div>
          </div>
          <div class="adm-roomfilter">
            <button type="button" data-rf="all"      aria-pressed="true">Both rooms</button>
            <button type="button" data-rf="meeting"  aria-pressed="false">Meeting</button>
            <button type="button" data-rf="workshop" aria-pressed="false">Workshop</button>
          </div>
          <div class="bk-grid" id="admDow"></div>
          <div class="bk-grid" id="admDays"></div>
          <div class="bk-key">
            <span><i style="background:var(--amber)"></i>Pending</span>
            <span><i style="background:var(--cedar-light)"></i>Confirmed</span>
            <span><i style="background:var(--blue)"></i>Blocked</span>
            <span><i style="background:var(--rose)"></i>Waitlist</span>
          </div>
        </div>
        <div class="adm-dayview" id="admDayView">
          <p class="bk-muted">Pick a day to see what is booked.</p>
        </div>
      </div>
    </div>

    <!-- ============ add a booking ============ -->
    <div id="admAdd" hidden>
      <div class="bk-panel" style="max-width:640px;">
        <div class="bk-field" style="margin-bottom:14px;">
          <label>What is this?</label>
          <div class="bk-setup" id="addKind">
            <button type="button" data-kind="booking" aria-pressed="true">A booking<span>taken by phone, email or in person</span></button>
            <button type="button" data-kind="blocked" aria-pressed="false">Close the room<span>maintenance, private use, holiday</span></button>
          </div>
        </div>

        <div class="bk-row">
          <div class="bk-field">
            <label for="addRoom">Room</label>
            <select id="addRoom"><option value="meeting">Meeting Room</option><option value="workshop">Workshop Room</option></select>
          </div>
          <div class="bk-field">
            <label for="addDate">Date</label>
            <input id="addDate" type="date"/>
          </div>
        </div>

        <div class="bk-field" style="margin-bottom:14px;">
          <label>Time <span class="bk-muted" id="addSlotHint">pick one or more</span></label>
          <div id="addSlots" class="bk-slots"></div>
        </div>

        <div id="addWho">
          <div class="bk-row">
            <div class="bk-field">
              <label for="addName">Name</label>
              <input id="addName" type="text" maxlength="120" placeholder="Who the room is for"/>
            </div>
            <div class="bk-field">
              <label for="addPhone">Phone</label>
              <input id="addPhone" type="tel" maxlength="40" placeholder="71 123 456"/>
            </div>
          </div>
          <div class="bk-row">
            <div class="bk-field">
              <label for="addEmail">Email <span class="bk-muted">(optional)</span></label>
              <input id="addEmail" type="email" maxlength="200" placeholder="Optional"/>
            </div>
            <div class="bk-field">
              <label for="addOrg">Company <span class="bk-muted">(optional)</span></label>
              <input id="addOrg" type="text" maxlength="120" placeholder="Optional"/>
            </div>
          </div>
          <div class="bk-row" id="addSetupRow" hidden>
            <div class="bk-field" style="grid-column:1/-1;">
              <label>Setup</label>
              <div class="bk-setup" id="addSetup">
                <button type="button" data-s="ushape" aria-pressed="false">U&#8209;shape<span>up to 30</span></button>
                <button type="button" data-s="classroom" aria-pressed="false">Classroom<span>up to 40</span></button>
              </div>
            </div>
          </div>
          <div class="bk-row">
            <div class="bk-field">
              <label for="addHeads">People</label>
              <input id="addHeads" type="number" min="1" max="40" placeholder="e.g. 10"/>
              <div class="hint" id="addCapHint"></div>
            </div>
            <div class="bk-field">
              <label for="addCat">Refreshments</label>
              <select id="addCat">
                <option value="none">None</option>
                <option value="refreshments">Refreshments &mdash; $3 pp</option>
                <option value="coffee_break">Coffee break &mdash; $5 pp</option>
                <option value="premium">Premium coffee break &mdash; $10 pp</option>
                <option value="meal">Meal break &mdash; on request</option>
              </select>
            </div>
          </div>
        </div>

        <div class="bk-row bk-row--1">
          <div class="bk-field">
            <label for="addNote">Note <span class="bk-muted">(only you see this)</span></label>
            <input id="addNote" type="text" maxlength="200" placeholder="Paid in cash / holding for Amanda / annual maintenance"/>
          </div>
        </div>

        <div class="bk-line" style="padding:10px 0 14px;border-top:1px solid var(--line);margin-top:4px;">
          <span>Estimated charge</span><span id="addTotal">&mdash;</span>
        </div>
        <button class="btn btn--primary btn--block" id="addGo">Add to the calendar</button>
        <p class="bk-note">This goes straight in as confirmed, so the slot closes on the public calendar immediately.</p>
      </div>
    </div>

    <div id="admList"></div>
  </div>
</section>

<script src="booking-admin.js"></script>
</body>
</html>
